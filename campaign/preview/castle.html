<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Verdigris - Castle preview</title>
<style>
  :root{--ink:#e9e2d0;--mute:#a59d8a;--panel:rgba(18,16,14,.78);--edge:rgba(233,226,208,.18);--on:#c9a24a}
  html,body{margin:0;height:100%;background:#0d0c0b;color:var(--ink);font:14px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #ui{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;pointer-events:auto}
  .row b{font-weight:600;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-width:52px;text-shadow:0 1px 2px #000,0 0 6px #000}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:8px;min-height:40px;min-width:44px;padding:0 10px;font:inherit;font-size:13px}
  button.on{border-color:var(--on);color:var(--on)}
  #stats{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:6px 10px;font:12px/1.4 ui-monospace,Menlo,monospace;pointer-events:none;white-space:pre-wrap}
  #err{position:fixed;inset:auto 8px 80px;color:#f88;font:12px monospace}
</style>
</head>
<body>
<div id="ui">
  <div class="row" id="rTime"><b data-i18n="c.pv.title">Castle preview</b></div>
  <div class="row" id="rView"><b data-i18n="c.pv.view">View</b></div>
  <div class="row" id="rTier"><b data-i18n="c.pv.tier">Quality</b></div>
  <div class="row" id="rLod"><b data-i18n="c.pv.lod">Model</b></div>
</div>
<div id="stats"></div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  (function () {
    var v = new URLSearchParams(location.search).get('v'), q = v ? '?v=' + encodeURIComponent(v) : '';
    ['../../i18n.js', '../core/umd.js', '../core/data.js', '../core/castle.js', '../render/castle-kit.js', 'castle.js']
      .forEach(function (f) { document.write('<script src="' + f + q + '"><\/script>'); });
  })();
</script>
</body>
</html>
